name: Task
description: A unit of work (code, docs, data, setup)
title: "[Task]: "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Why is this needed? How does it help the project?
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: When is this task considered done?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes and resources
      description: Links, references, related issues
