name: Experiment
description: A model or method experiment
title: "[Experiment]: "
labels: ["type: experiment", "area: model"]
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: What are we testing and what do we expect?
      placeholder: "e.g. XLM-R base will outperform BERTurk on macro-F1."
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: "e.g. dbmdz/bert-base-turkish-cased"
    validations:
      required: true
  - type: input
    id: data-version
    attributes:
      label: Data version
      placeholder: "e.g. labeled-v1 (train/val/test)"
    validations:
      required: true
  - type: input
    id: config
    attributes:
      label: Config file
      placeholder: "e.g. configs/berturk_acsa.yaml"
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Fill in after the experiment. Macro-F1, per-aspect F1, W&B link.
