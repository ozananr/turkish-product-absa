[project]
name = "absa"
version = "0.1.0"
description = "Aspect-based sentiment analysis for Turkish product reviews"
readme = "README.md"
authors = [
    { name = "Ozan Anar", email = "146670418+ozananr@users.noreply.github.com" },
    { name = "Mehmet Salih KENDİRKIRAN" },
    { name = "Yusuf AÇIK" },
]
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.30.0",
    "openai>=3.36.1",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
