[project]
name = "absa"
version = "0.1.0"
description = "Aspect-based sentiment analysis for Turkish product reviews"
readme = "README.md"
authors = [
    { name = "Ozan Anar", email = "146670418+ozananr@users.noreply.github.com" },
    { name = "Mehmet Salih KENDİRKIRAN" },
    { name = "Yusuf AÇIK" },
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
